paths:
  /eth/miscellaneous/getBlobSidecarByTxHash:
    post:
      summary: "[Miscellaneous] eth_getBlobSidecarByTxHash"
      tags:
        - eth
      operationId: getBlobSidecarByTxHash
      description: |
        Returns the blob sidecar (data blob) associated with a specific transaction hash.

        **JSONRPC:** `eth_getBlobSidecarByTxHash`

      parameters:
        - name: transactionHash
          in: query
          description: Hash of a transaction that includes a blob.
          required: true
          schema:
            type: string
            format: 32-byte DATA
        - name: isFull
          in: query
          description: If true, returns the complete blob data. If false, returns only the first 32 bytes of each blob.
          required: true
          schema:
            type: boolean

      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../../components/requests/JsonRpcRequest.yaml#/components/schemas/JsonRpcRequest"
                - $ref: "#/components/schemas/EthGetBlobSidecarByTxHashReq"

      responses:
        200:
          description: Returns the blob sidecar object associated with the transaction.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../../components/responses/JsonRpcResponse.yaml#/components/schemas/JsonRpcResponse"
                  - $ref: "#/components/schemas/EthGetBlobSidecarByTxHashResp"

      x-codeSamples:
        - lang: "Shell"
          label: "Curl"
          source:
            $ref: "../../../code-samples/curl/eth/miscellaneous/getBlobSidecarByTxHash.sh"

components:
  schemas:
    EthGetBlobSidecarByTxHashReq:
      type: object
      required:
        - method
        - params
      properties:
        method:
          type: string
          default: 'eth_getBlobSidecarByTxHash'
        params:
          type: array
          items:
            properties:
              TransactionHash:
                type: string
                format: 32-byte DATA
                title: TransactionHash
                description: Hash of a transaction that includes a blob.
              IsFull:
                type: boolean
                title: IsFull
                description: If true, returns the complete blob data. If false, returns only the first 32 bytes of each blob.
          example: ["0xe24ecc1f10799b512817f928a0a45e71b170bd221e2791fdeba992c5bf51418c", false]

    EthGetBlobSidecarByTxHashResp:
      type: object
      properties:
        result:
          type: object
          properties:
            blobSidecar:
              type: object
              description: Contains the blob data, commitments and proofs.
              properties:
                blobs:
                  type: array
                  items:
                    type: string
                    format: DATA
                  description: Array of blob data in hexadecimal format (complete data or first 32 bytes depending on full flag).
                commitments:
                  type: array
                  items:
                    type: string
                    format: DATA
                  description: Array of KZG commitments for the blobs.
                proofs:
                  type: array
                  items:
                    type: string
                    format: DATA
                  description: Array of KZG proofs for blob verification.
                version:
                  type: integer
                  description: The version number of the blob sidecar.
            blockHash:
              type: string
              format: 32-byte DATA
              description: The hash of the block the blob is associated with.
            blockNumber:
              type: string
              format: hex
              description: The block number in hexadecimal format.
            txHash:
              type: string
              format: 32-byte DATA
              description: The hash of the transaction that includes the blob.
            txIndex:
              type: string
              format: hex
              description: The index of the transaction in the block.
