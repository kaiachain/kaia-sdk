            ethTxTypeCompatibleBlock:
              type: integer
            governance:
              type: object
              properties:
                govParamContract:
                  type: string
                governanceMode:
                  type: string
                governingNode:
                  type: string
                kip71:
                  type: object
                  properties:
                    basefeedenominator:
                      type: integer
                    gastarget:
                      type: number
                    lowerboundbasefee:
                      type: number
                    maxblockgasusedforbasefee:
                      type: number
                    upperboundbasefee:
                      type: number
                reward:
                  type: object
                  properties:
                    deferredTxFee:
                      type: boolean
                    kip82ratio:
                      type: string
                    minimumStake:
                      type: integer
                    mintingAmount:
                      type: number
                    proposerUpdateInterval:
                      type: integer
                    ratio:
                      type: string
                    stakingUpdateInterval:
                      type: integer
                    useGiniCoeff:
                      type: boolean
                    stakingRewardThreshold:
                      type: integer
                    useFlexReward:
                      type: boolean
            istanbul:
              type: object
              properties:
                epoch:
                  type: integer
                policy:
                  type: integer
                sub:
                  type: integer
            istanbulCompatibleBlock:
              type: integer
            koreCompatibleBlock:
              type: integer
            shanghaiCompatibleBlock:
              type: integer
            cancunCompatibleBlock:
              type: integer
            kaiaCompatibleBlock:
              type: integer
            pragueCompatibleBlock:
              type: integer
            osakaCompatibleBlock:
              type: integer
            kip160CompatibleBlock:
              type: integer
            kip160ContractAddress:
              type: string
            randaoCompatibleBlock:
              type: integer
            randaoRegistry:
              type: object
