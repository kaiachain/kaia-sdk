<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>@kaiachain/ethers-ext/v6 finschia swap demo</title>
  </head>
  <body>
    <body>
      <p><button id="btnConnectMM" onclick="connectMM()">Connect MetaMask</button></p>
      <hr/>
      <p>
        <button id="btnNetKairos" onclick="switchKairos()">Switch to Kairos</button>
      </p>
      <hr/>
      <p>For MetaMask</p>
      <p><button id="btnDeriveFinschiaAddress" onclick="deriveFinschiaAddress()">Derive Finschia address</button></p>
      <p>
        <div>accounts: <text id="textAccount"></text></div>
        <div>chainId: <text id="textChainId"></text></div>
      </p>
      <p>
        <div>message signature: <text id="textSignature"></text></div>
        <div>recovered signer address: <text id="textRecoveredAddress"></text></div>
      </p>
      <p>
        <div>derived finschia address: <text id="textDerivedFinschiaAddress"></text></div>
        <div>cony balance: <text id="textConyBalance"></text></div>
        <div>provisioned: <text id="textProvisioned"></text></div>
        <div>claimed: <text id="textClaimed"></text></div>
      </p>

      <p><button id="btnRequestProvision" onclick="requestProvision()" disabled>Request Provision</button></p>
      <p>
        <div>Provision txhash: <text id="textProvisionTxhash"></text></div>
      </p>
      <hr/>
      <p><button id="btnRequestClaim" onclick="requestClaim()" disabled>Request Claim</button></p>
      <p>
        <div>balance: <text id="textBalance"></text></div>
        <div>Claim txhash: <text id="textClaimTxhash"></text></div>
      </p>
    </body>

    <script src="https://code.jquery.com/jquery-3.7.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.1/ethers.umd.min.js" integrity="sha512-UvwB92yhzWWQstXZT31l1Fc7wv3sRG7uWBSFZ6TeJ0LIfBe8oM9p2oufp1Y5nuBAso+FYHR03WocHr5+wqWJ7A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://bundle.run/bech32@2.0.0"></script>

    <!-- to use remote ethers -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/@kaiachain/ethers-ext@latest/dist/ethers-ext.v6.bundle.js"></script> -->

    <!--- to use locally compiled ethers -->
    <script src="ethers-ext.v6.bundle.js"></script>
    <script src="main.js"></script>
  </body>
</html>
